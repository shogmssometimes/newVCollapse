<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>cHUD — Compact HUD for Derived Stats</title>
    <style>
      ::selection{background:transparent !important;color:inherit !important}
    </style>
    <script>
      // See index.html for why the viewport meta + this listener are
      // needed to stop pinch-to-zoom here — the HUD is its own iframe
      // document, so it needs this independently of the parent page's
      // copy. Only Safari's non-standard gesturestart/gesturechange are
      // used (fire exclusively on an actual 2-finger pinch); an earlier
      // version also added a 2+-finger touchmove preventDefault here,
      // but registering ANY non-passive touchmove listener on the HUD's
      // document made the engine treat every touchmove synchronously,
      // which broke the Engram Q/Gear Q swipe-to-cycle and long-press
      // gestures on mobile — removed.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    </script>
    <!-- Not processed by Vite — already present in public/chud/ -->
    <script src="./meter-bridge.js"></script>
    <script type="module" crossorigin src="./assets/chud-app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/chud-app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
