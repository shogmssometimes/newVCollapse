    <script>
      // Pinch-to-zoom lockout: the viewport meta's user-scalable=no/
      // maximum-scale=1 above is ignored by some Safari versions, so also
      // swallow Safari's non-standard gesturestart/gesturechange events,
      // which fire exclusively on an actual 2-finger pinch and never
      // interfere with single-finger gestures. (An earlier version also
      // registered a 2+-finger touchmove preventDefault here, but any
      // non-passive touchmove listener on the document made the browser
      // treat every touchmove synchronously, which broke swipe-to-cycle/
      // long-press gestures — e.g. the HUD's Engram Q and Gear Q — on
      // mobile, so it was removed.)
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    </script>
