<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Collapse GM Companion</title>
    <script>
      // See index.html for why the viewport meta + this listener are
      // needed to stop pinch-to-zoom (and why the touchmove half of the
      // old version was removed — it broke single-finger swipe/hold
      // gestures).
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gm-main.tsx"></script>
  </body>
</html>
