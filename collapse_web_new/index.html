<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="192x192" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Collapse" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Collapse Full Build</title>
    <script>
      // Belt-and-suspenders pinch-to-zoom lockout: the viewport meta's
      // user-scalable=no/maximum-scale=1 above is ignored by some Safari
      // versions, so also swallow the two actual gesture mechanisms —
      // Safari's non-standard gesturestart/change/end events, and any
      // 2+ finger touchmove (the generic pinch trigger everywhere else).
      // Scoped to >1 touch only, so normal single-finger swipe/drag/hold
      // gestures elsewhere in the app are untouched.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
